<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="title description">
  <title id="title">How our class read last month</title>
  <desc id="description">Original teaching example with fictional data: print books 22 of 40, digital books 12 of 40, and audiobooks 6 of 40.</desc>
  <rect width="760" height="550" fill="#eee9dc"/>
  <rect x="20" y="20" width="720" height="510" fill="#f5f5f3" stroke="#25282b" stroke-width="2"/>
  <rect x="20" y="20" width="720" height="48" fill="#25282b"/>
  <text x="42" y="50" fill="#d8ed61" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">CLASSROOM SAMPLE / 01</text>
  <text x="42" y="115" fill="#25282b" font-family="Arial, sans-serif" font-size="35" font-weight="700">How our class read last month</text>
  <text x="42" y="147" fill="#60666a" font-family="Arial, sans-serif" font-size="17">One preferred format per student · fictional class of 40</text>
  <line x1="42" y1="170" x2="718" y2="170" stroke="#25282b" stroke-width="2"/>
  <text x="42" y="219" fill="#25282b" font-family="Arial, sans-serif" font-size="21" font-weight="700">Print books</text>
  <text x="42" y="298" fill="#25282b" font-family="Arial, sans-serif" font-size="21">Digital books</text>
  <text x="42" y="377" fill="#25282b" font-family="Arial, sans-serif" font-size="21">Audiobooks</text>
  <rect x="221" y="193" width="330" height="39" fill="#d8ed61"/>
  <rect x="221" y="272" width="180" height="39" fill="#25282b"/>
  <rect x="221" y="351" width="90" height="39" fill="#60666a"/>
  <text x="564" y="220" fill="#25282b" font-family="Arial, sans-serif" font-size="23" font-weight="700">22</text>
  <text x="414" y="299" fill="#25282b" font-family="Arial, sans-serif" font-size="23" font-weight="700">12</text>
  <text x="324" y="378" fill="#25282b" font-family="Arial, sans-serif" font-size="23" font-weight="700">6</text>
  <line x1="221" y1="415" x2="581" y2="415" stroke="#9da29f"/>
  <g fill="#60666a" font-family="Arial, sans-serif" font-size="14">
    <text x="217" y="438">0</text><text x="302" y="438">6</text><text x="393" y="438">12</text><text x="482" y="438">18</text><text x="573" y="438">24</text>
  </g>
  <line x1="42" y1="462" x2="718" y2="462" stroke="#b9bfba"/>
  <text x="42" y="496" fill="#25282b" font-family="Arial, sans-serif" font-size="16" font-weight="700">22 OF 40 = 55% CHOSE PRINT</text>
  <text x="718" y="496" text-anchor="end" fill="#60666a" font-family="Arial, sans-serif" font-size="13">ILLUSTRATIVE DATA · NOT A REAL SURVEY</text>
</svg>
